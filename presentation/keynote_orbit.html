<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperNotch — Accelerating 3D Orbit Keynote (20s • 4K)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #020203;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 4K 16:9 Viewport Stage */
    #stage-container {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #050506;
      overflow: hidden;
      box-shadow: 0 40px 140px rgba(0,0,0,0.98);
      transform-origin: center center;
      perspective: 1200px;
    }

    /* Three.js 3D WebGL Layer (Bezel, Rim Light, Orbiting Debris) */
    #three-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }

    /* 3D CSS World Rig for HTML Overlay & Widgets */
    #orbit-camera-rig {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      pointer-events: none;
      z-index: 20;
    }

    /* Center Anchor for Floating Notch */
    .notch-orbit-anchor {
      position: relative;
      width: 0;
      height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    /* The Notch Pill Element */
    .floating-notch-pill {
      position: absolute;
      width: 210px;
      height: 38px;
      background: #000;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 15px 40px rgba(0,0,0,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      z-index: 30;
      padding: 0 16px;
      overflow: hidden;
    }

    /* Rotating Aura Glow */
    .orbit-glow-aura {
      position: absolute;
      width: 240px;
      height: 70px;
      border-radius: 40px;
      background: #8b5cf6;
      filter: blur(35px);
      opacity: 0;
      pointer-events: none;
      z-index: 15;
      transition: background 0.4s ease;
    }

    /* Centrifugally Ejected Widgets */
    .orbiting-widget {
      position: absolute;
      background: rgba(14, 16, 24, 0.94);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      opacity: 0;
      pointer-events: none;
      transform-style: preserve-3d;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
    }

    /* Progress bar widget */
    .mini-progress-track {
      width: 90px;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .mini-progress-fill {
      width: 0%;
      height: 100%;
      background: #3b82f6;
    }

    /* Laser scanner widget */
    .mini-scan-box {
      width: 80px;
      height: 18px;
      border: 1px solid rgba(6, 182, 212, 0.5);
      border-radius: 3px;
      position: relative;
      overflow: hidden;
    }
    .mini-scan-laser {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: #06b6d4;
      box-shadow: 0 0 8px #06b6d4;
    }

    /* Waveform widget */
    .mini-waveform {
      display: flex;
      align-items: center;
      gap: 2.5px;
      height: 16px;
    }
    .mini-wave-bar {
      width: 2.5px;
      height: 4px;
      background: #ec4899;
      border-radius: 2px;
    }

    /* Wordmark Resolution */
    .final-wordmark {
      position: absolute;
      top: 55px;
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 7px;
      color: #f5f5f7;
      text-transform: uppercase;
      opacity: 0;
      white-space: nowrap;
    }

    /* Cinematic Minimal HUD Telemetry */
    .orbit-hud {
      position: absolute;
      top: 48px;
      left: 64px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: rgba(245, 245, 247, 0.45);
      letter-spacing: 1px;
      display: flex;
      gap: 20px;
      z-index: 100;
    }
    .hud-val {
      color: #f5f5f7;
      font-weight: 700;
    }

    .orbit-timecode {
      position: absolute;
      bottom: 48px;
      right: 64px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: rgba(245, 245, 247, 0.4);
      z-index: 100;
    }

    /* Player controls */
    #playback-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 18, 22, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 100px;
      padding: 6px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 999;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }
    .ctl-btn {
      background: transparent;
      border: none;
      color: #f5f5f7;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 100px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ctl-btn:hover { background: rgba(255,255,255,0.08); }
    .ctl-btn.primary { background: #f5f5f7; color: #000; font-weight: 600; }
    .ctl-track {
      width: 260px;
      height: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }
    .ctl-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: #f5f5f7;
    }
  </style>
</head>
<body>

  <div id="stage-container">
    
    <!-- Three.js Canvas for 3D Bezel & Dynamic Rotating Rim Light -->
    <canvas id="three-canvas"></canvas>

    <!-- 3D Orbit Camera Rig -->
    <div id="orbit-camera-rig">
      <div class="notch-orbit-anchor" id="orbit-anchor">
        
        <!-- Glow Aura -->
        <div class="orbit-glow-aura" id="glow-aura"></div>

        <!-- The Floating Notch Pill -->
        <div class="floating-notch-pill" id="notch-pill">
          <div style="display:flex; align-items:center; gap:8px;" id="notch-interior">
            <div style="width:10px; height:10px; border-radius:50%; background:#111; border:1px solid #222;"></div>
            <div style="width:3px; height:3px; border-radius:50%; background:#22c55e; box-shadow:0 0 4px #22c55e;"></div>
          </div>
        </div>

        <!-- Centrifugally Orbiting Widgets -->
        <!-- Widget 1: Blue Folder & Progress -->
        <div class="orbiting-widget" id="w-folder" style="border-color:rgba(59,130,246,0.4);">
          <span>📁</span>
          <span>Core.bundle</span>
          <div class="mini-progress-track">
            <div class="mini-progress-fill" id="w-folder-bar"></div>
          </div>
        </div>

        <!-- Widget 2: Orange Struck Password -->
        <div class="orbiting-widget" id="w-pass" style="border-color:rgba(249,115,22,0.4);">
          <span style="font-family:'JetBrains Mono'; letter-spacing:2px; position:relative;">
            <span id="pass-chars">••••••••</span>
            <div id="pass-strike" style="position:absolute; top:50%; left:0; width:0; height:2px; background:#f97316;"></div>
          </span>
          <span id="pass-lock" style="color:#f97316;">🔒</span>
        </div>

        <!-- Widget 3: Cyan OCR Scanner -->
        <div class="orbiting-widget" id="w-scan" style="border-color:rgba(6,182,212,0.4);">
          <div class="mini-scan-box">
            <div class="mini-scan-laser" id="w-scan-laser"></div>
          </div>
          <span style="font-size:11px; color:#06b6d4; font-family:'JetBrains Mono';">OCR SCAN</span>
        </div>

        <!-- Widget 4: Pink Waveform -->
        <div class="orbiting-widget" id="w-wave" style="border-color:rgba(236,72,153,0.4);">
          <div class="mini-waveform">
            <div class="mini-wave-bar"></div>
            <div class="mini-wave-bar"></div>
            <div class="mini-wave-bar"></div>
            <div class="mini-wave-bar"></div>
          </div>
          <span style="font-size:11px; color:#ec4899;">AUDIO AI</span>
        </div>

        <!-- Widget 5: Green Timer -->
        <div class="orbiting-widget" id="w-timer" style="border-color:rgba(34,197,94,0.4); color:#22c55e;">
          <span>⏱️</span>
          <span style="font-family:'JetBrains Mono'; font-size:12px;">25:00</span>
        </div>

        <!-- Widget 6: Teal Lock -->
        <div class="orbiting-widget" id="w-lock" style="border-color:rgba(20,184,166,0.4); color:#14b8a6;">
          <span>🛡️</span>
          <span style="font-size:11px;">SECURED</span>
        </div>

        <!-- Final Wordmark -->
        <div class="final-wordmark" id="wordmark">HyperNotch</div>

      </div>
    </div>

    <!-- HUD Telemetry -->
    <div class="orbit-hud">
      <div>ORBIT: <span class="hud-val" id="hud-orbit-speed">08.0°/s</span></div>
      <div>YAW: <span class="hud-val" id="hud-yaw">+000.0°</span></div>
      <div>DUTCH: <span class="hud-val" id="hud-dutch">+00.0°</span></div>
      <div>LENS: <span class="hud-val">50MM EQUIV</span></div>
    </div>

    <div class="orbit-timecode" id="orbit-timecode">00.0s / 20.0s</div>

  </div>

  <!-- Director bar -->
  <div id="playback-bar">
    <button class="ctl-btn primary" id="btn-play">▶ Play Film</button>
    <button class="ctl-btn" id="btn-sound">Sound: On</button>
    <div class="ctl-track" id="track-line">
      <div class="ctl-fill" id="track-fill"></div>
    </div>
    <span style="font-size:11px; width:35px;" id="time-text">00s</span>
    <button class="ctl-btn" id="btn-fs">⛶</button>
  </div>

  <script>
    // Scale viewport
    function resizeStage() {
      const container = document.getElementById('stage-container');
      const scaleX = window.innerWidth / 1920;
      const scaleY = window.innerHeight / 1080;
      const scale = Math.min(scaleX, scaleY);
      container.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeStage);
    resizeStage();

    // ==========================================================
    // 1. THREE.JS 3D ENGINE (Floating Bezel, Orbiting Rim Light)
    // ==========================================================
    const canvas = document.getElementById('three-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(1920, 1080);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 1920 / 1080, 1, 3000);
    camera.position.set(0, 0, 750);

    // Ambient light
    const ambLight = new THREE.AmbientLight(0xffffff, 0.25);
    scene.add(ambLight);

    // Hard Rim Light that rotates with the camera
    const rimLight = new THREE.DirectionalLight(0xdbeafe, 2.5);
    rimLight.position.set(500, 200, 300);
    scene.add(rimLight);

    // 3D Floating MacBook Top Bezel Geometry
    const bezelGroup = new THREE.Group();
    const bezelMat = new THREE.MeshStandardMaterial({
      color: 0x050506, // Matte charcoal bezel (#050506)
      metalness: 0.85,
      roughness: 0.35
    });

    const bezelGeo = new THREE.BoxGeometry(1100, 26, 12);
    const bezelMesh = new THREE.Mesh(bezelGeo, bezelMat);
    bezelMesh.position.y = 12;
    bezelGroup.add(bezelMesh);

    // Cool Aluminum Rim Edge Line
    const rimEdgeGeo = new THREE.BoxGeometry(1100, 1.5, 12.2);
    const rimEdgeMat = new THREE.MeshBasicMaterial({ color: 0x93c5fd, transparent: true, opacity: 0.5 });
    const rimEdge = new THREE.Mesh(rimEdgeGeo, rimEdgeMat);
    rimEdge.position.y = -1;
    bezelGroup.add(rimEdge);

    scene.add(bezelGroup);

    function renderThree() {
      requestAnimationFrame(renderThree);
      renderer.render(scene, camera);
    }
    renderThree();

    // ==========================================================
    // 2. PROCEDURAL SOUND SYNTHESIZER
    // 40Hz hum, rising plucks, whip-pan swooshes, bass swell, chime
    // ==========================================================
    let audioCtx = null;
    let isSoundOn = true;
    let isPlaying = false;
    let humOsc = null;
    let humGain = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function startHum() {
      if (!isSoundOn || !audioCtx) return;
      stopHum();
      humOsc = audioCtx.createOscillator();
      humGain = audioCtx.createGain();
      humOsc.type = 'sine';
      humOsc.frequency.setValueAtTime(40, audioCtx.currentTime); // 40Hz low hum
      humGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      humGain.gain.linearRampToValueAtTime(0.09, audioCtx.currentTime + 1.2);
      humOsc.connect(humGain);
      humGain.connect(audioCtx.destination);
      humOsc.start();
    }

    function stopHum(fade = 0.4) {
      if (humOsc && humGain && audioCtx) {
        humGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + fade);
        setTimeout(() => {
          try { humOsc.stop(); } catch(e){}
          humOsc = null;
        }, fade * 1000);
      }
    }

    function playWhipPluck(freq) {
      if (!isSoundOn || !audioCtx) return;
      // Synth pluck
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.24, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(freq * 3, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(freq * 0.9, audioCtx.currentTime + 0.35);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);

      // Whip air swoosh
      const bufSize = audioCtx.sampleRate * 0.12;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = buf;
      const nFilter = audioCtx.createBiquadFilter();
      nFilter.type = 'bandpass';
      nFilter.frequency.setValueAtTime(1400, audioCtx.currentTime);
      const nGain = audioCtx.createGain();
      nGain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      nGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      noise.connect(nFilter);
      nFilter.connect(nGain);
      nGain.connect(audioCtx.destination);
      noise.start();
    }

    function playBassSwell() {
      if (!isSoundOn || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(50, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(70, audioCtx.currentTime + 5.5);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + 2.0);
      gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 5.8);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 5.8);
    }

    function playResolutionChime() {
      if (!isSoundOn || !audioCtx) return;
      const chords = [523.25, 659.25, 783.99, 1046.50];
      chords.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.03);
        gain.gain.setValueAtTime(0.14 / (i + 1), audioCtx.currentTime + i * 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * 0.03);
        osc.stop(audioCtx.currentTime + 2.5);
      });
    }

    // ==========================================================
    // 3. GSAP ACCELERATING ORBIT TIMELINE
    // 8°/s -> 20°/s -> 60°/s -> Brake to stop
    // ==========================================================
    const orbitRig = document.getElementById('orbit-camera-rig');
    const glowAura = document.getElementById('glow-aura');
    const notchPill = document.getElementById('notch-pill');
    const wordmark = document.getElementById('wordmark');
    const hudOrbitSpeed = document.getElementById('hud-orbit-speed');
    const hudYaw = document.getElementById('hud-yaw');
    const hudDutch = document.getElementById('hud-dutch');
    const orbitTimecode = document.getElementById('orbit-timecode');
    const trackFill = document.getElementById('track-fill');
    const timeText = document.getElementById('time-text');

    // Camera State
    const cam = {
      yaw: 0,
      pitch: 8,
      dutch: 0,
      zoom: 1.0,
      speedDegSec: 8
    };

    function updateOrbitView() {
      // Rotate CSS anchor
      orbitRig.style.transform = `scale(${cam.zoom}) rotateZ(${cam.dutch}deg) rotateX(${cam.pitch}deg) rotateY(${cam.yaw}deg)`;

      // Rotate Three.js bezel & light
      bezelGroup.rotation.y = THREE.MathUtils.degToRad(-cam.yaw);
      bezelGroup.rotation.z = THREE.MathUtils.degToRad(-cam.dutch);
      bezelGroup.rotation.x = THREE.MathUtils.degToRad(-cam.pitch);

      // Rotate rim light with camera
      const rad = THREE.MathUtils.degToRad(-cam.yaw);
      rimLight.position.x = 600 * Math.sin(rad + 0.6);
      rimLight.position.z = 600 * Math.cos(rad + 0.6);

      // HUD readout
      hudOrbitSpeed.textContent = `${cam.speedDegSec.toFixed(1).padStart(4, '0')}°/s`;
      hudYaw.textContent = `${(cam.yaw >= 0 ? '+' : '')}${cam.yaw.toFixed(1).padStart(5, '0')}°`;
      hudDutch.textContent = `${(cam.dutch >= 0 ? '+' : '')}${cam.dutch.toFixed(1).padStart(4, '0')}°`;
    }

    const film = gsap.timeline({
      paused: true,
      onUpdate: () => {
        updateOrbitView();
        const cur = film.time();
        const p = film.progress();
        orbitTimecode.textContent = `${cur.toFixed(1).padStart(4, '0')}s / 20.0s`;
        timeText.textContent = `${Math.floor(cur)}s`;
        trackFill.style.width = `${p * 100}%`;
      },
      onComplete: () => {
        document.getElementById('btn-play').textContent = '↺ Replay';
        isPlaying = false;
        stopHum();
      }
    });

    // ----------------------------------------------------------
    // 00-04s. HOOK (Orbit at 8°/sec, camera drifting right)
    // ----------------------------------------------------------
    film.add(() => { startHum(); }, 0);

    // Orbit 8°/s for 4s = 32°
    film.to(cam, {
      yaw: 32,
      speedDegSec: 8,
      duration: 4.0,
      ease: 'none'
    }, 0);

    // Breathing violet pulses
    film.to(glowAura, { opacity: 0.4, scale: 1.25, duration: 0.3, ease: 'power2.out' }, 1.0)
        .to(glowAura, { opacity: 0, scale: 1.0, duration: 0.4, ease: 'power2.in' }, 1.3)
        .to(glowAura, { opacity: 0.45, scale: 1.35, duration: 0.3, ease: 'power2.out' }, 2.4)
        .to(glowAura, { opacity: 0, scale: 1.0, duration: 0.4, ease: 'power2.in' }, 2.7);

    // ----------------------------------------------------------
    // 04-10s. BUILD (Orbit doubles to 20°/sec, snap-zooms & whip-pans)
    // ----------------------------------------------------------
    // From 32° + (20°/s * 6s) = 152°
    film.to(cam, {
      yaw: 152,
      speedDegSec: 20,
      duration: 6.0,
      ease: 'none'
    }, 4.0);

    // Build Beat 1: Folder centrifugal fly-in (04.0s - 06.0s)
    film.add(() => { playWhipPluck(330); }, 4.0);
    film.to(cam, { zoom: 1.2, duration: 0.15, yoyo: true, repeat: 1, ease: 'power2.out' }, 4.0);
    film.to(cam, { yaw: '+=15', duration: 0.25, ease: 'power4.out' }, 4.0); // whip pan 15°
    film.to(glowAura, { background: '#3b82f6', opacity: 0.4, duration: 0.2 }, 4.0);
    film.fromTo('#w-folder', 
      { x: -30, z: -100, opacity: 0, scale: 0.5 }, 
      { x: -160, y: -40, z: 80, opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, 
      4.0
    );
    film.to('#w-folder-bar', { width: '100%', duration: 1.2, ease: 'power1.inOut' }, 4.2);
    film.to('#w-folder', { opacity: 0, duration: 0.15 }, 5.85);

    // Build Beat 2: Password centrifugal snap (06.0s - 08.0s)
    film.add(() => { playWhipPluck(440); }, 6.0);
    film.to(cam, { zoom: 1.22, duration: 0.15, yoyo: true, repeat: 1, ease: 'power2.out' }, 6.0);
    film.to(cam, { yaw: '+=15', duration: 0.25, ease: 'power4.out' }, 6.0);
    film.to(glowAura, { background: '#f97316', opacity: 0.4, duration: 0.2 }, 6.0);
    film.fromTo('#w-pass', 
      { x: 30, z: -100, opacity: 0, scale: 0.5 }, 
      { x: 160, y: -30, z: 90, opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)' }, 
      6.0
    );
    film.to('#pass-strike', { width: '100%', duration: 0.45, ease: 'power3.out' }, 6.5);
    film.to('#pass-lock', { rotate: 25, duration: 0.1, yoyo: true, repeat: 1 }, 6.9);
    film.to('#w-pass', { opacity: 0, duration: 0.15 }, 7.85);

    // Build Beat 3: Cyan OCR Scan (08.0s - 10.0s)
    film.add(() => { playWhipPluck(587.33); }, 8.0);
    film.to(cam, { zoom: 1.22, duration: 0.15, yoyo: true, repeat: 1, ease: 'power2.out' }, 8.0);
    film.to(cam, { yaw: '+=15', duration: 0.25, ease: 'power4.out' }, 8.0);
    film.to(glowAura, { background: '#06b6d4', opacity: 0.4, duration: 0.2 }, 8.0);
    film.fromTo('#w-scan', 
      { y: 60, z: -100, opacity: 0, scale: 0.5 }, 
      { y: 70, z: 100, opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)' }, 
      8.0
    );
    film.fromTo('#w-scan-laser', { top: 0 }, { top: '100%', duration: 1.2, ease: 'linear' }, 8.2);
    film.to('#w-scan', { opacity: 0, duration: 0.15 }, 9.85);

    // ----------------------------------------------------------
    // 10-16s. CRACK (Orbit triples to near-blur 60°/sec, hard dutch tilt)
    // ----------------------------------------------------------
    film.add(() => { 
      playWhipPluck(880);
      playBassSwell(); 
    }, 10.0);

    // Orbit triples: 152° + (60°/s * 6s) = 512°
    film.to(cam, {
      yaw: 512,
      speedDegSec: 60,
      duration: 6.0,
      ease: 'power1.in'
    }, 10.0);

    // Hard dutch tilt banking into turn (-18°)
    film.to(cam, {
      dutch: -18,
      duration: 1.2,
      ease: 'power2.out'
    }, 10.0);

    // Pill snap-expands with 0.4s elastic overshoot
    film.to(notchPill, {
      width: 480,
      height: 44,
      duration: 0.4,
      ease: 'back.out(2.2)'
    }, 10.0);

    // Glow blooms into all five accent colors
    film.to(glowAura, {
      background: 'radial-gradient(circle, #ec4899 0%, #22c55e 30%, #14b8a6 60%, #8b5cf6 100%)',
      width: 520,
      opacity: 0.65,
      filter: 'blur(45px)',
      duration: 0.5
    }, 10.0);

    // ALL WIDGETS FLING OUTWARD AT ONCE (Orbiting like space debris!)
    film.fromTo('#w-folder', { opacity: 0, scale: 0.2 }, { x: -240, y: -90, z: 120, opacity: 1, scale: 0.95, duration: 0.5, ease: 'back.out(2)' }, 10.05);
    film.fromTo('#w-pass',   { opacity: 0, scale: 0.2 }, { x: 220, y: -80, z: 100, opacity: 1, scale: 0.95, duration: 0.5, ease: 'back.out(2)' }, 10.1);
    film.fromTo('#w-scan',   { opacity: 0, scale: 0.2 }, { x: -220, y: 80, z: 140, opacity: 1, scale: 0.95, duration: 0.5, ease: 'back.out(2)' }, 10.15);
    film.fromTo('#w-wave',   { opacity: 0, scale: 0.2 }, { x: 230, y: 70, z: 110, opacity: 1, scale: 0.95, duration: 0.5, ease: 'back.out(2)' }, 10.2);
    film.fromTo('#w-timer',  { opacity: 0, scale: 0.2 }, { x: 0, y: -110, z: 160, opacity: 1, scale: 1.05, duration: 0.5, ease: 'back.out(2)' }, 10.25);
    film.fromTo('#w-lock',   { opacity: 0, scale: 0.2 }, { x: 0, y: 110, z: 130, opacity: 1, scale: 1.05, duration: 0.5, ease: 'back.out(2)' }, 10.3);

    // Strobing rim light once per rotation
    film.to(rimLight, { intensity: 4.5, duration: 0.15, yoyo: true, repeat: 7 }, 11.0);

    // ----------------------------------------------------------
    // 16-20s. RESOLUTION (Brakes hard over 0.6s, levels out, chime)
    // ----------------------------------------------------------
    film.add(() => {
      stopHum(0.15); // hard silence
    }, 16.0);

    // Orbit brakes hard over 0.6s to dead stop (at 720° = clean 2 full rotations)
    film.to(cam, {
      yaw: 720,
      dutch: 0,
      speedDegSec: 0,
      duration: 0.6,
      ease: 'power3.out'
    }, 16.0);

    // All widgets snap back into the pill in 0.3s contraction
    film.to(['#w-folder', '#w-pass', '#w-scan', '#w-wave', '#w-timer', '#w-lock'], {
      x: 0,
      y: 0,
      z: 0,
      scale: 0.1,
      opacity: 0,
      duration: 0.3,
      ease: 'power3.in'
    }, 16.0);

    film.to(notchPill, {
      width: 210,
      height: 38,
      duration: 0.3,
      ease: 'power3.out'
    }, 16.0);

    // Single calm violet pulse
    film.to(glowAura, {
      background: '#8b5cf6',
      width: 240,
      opacity: 0.4,
      duration: 0.3
    }, 16.0);
    film.to(glowAura, { opacity: 0, duration: 0.7, ease: 'power2.out' }, 16.4);

    // Camera pulls back 15% (zoom 1.0 -> 0.85)
    film.to(cam, {
      zoom: 0.85,
      pitch: 0,
      duration: 1.2,
      ease: 'power2.out'
    }, 16.4);

    // Wordmark "HyperNotch" fades in beneath it
    film.to(wordmark, {
      opacity: 1,
      duration: 1.0,
      ease: 'power2.out'
    }, 17.2);

    // Final closing chime at 18.8s
    film.add(() => { playResolutionChime(); }, 18.8);

    // ==========================================================
    // CONTROLLER HANDLERS
    // ==========================================================
    const btnPlay = document.getElementById('btn-play');
    btnPlay.addEventListener('click', () => {
      initAudio();
      if (isPlaying) {
        film.pause();
        stopHum();
        btnPlay.textContent = '▶ Play Film';
        isPlaying = false;
      } else {
        if (film.progress() === 1) film.restart();
        else film.play();
        btnPlay.textContent = '⏸ Pause';
        isPlaying = true;
      }
    });

    const btnSound = document.getElementById('btn-sound');
    btnSound.addEventListener('click', () => {
      isSoundOn = !isSoundOn;
      btnSound.textContent = isSoundOn ? 'Sound: On' : 'Sound: Off';
      if (!isSoundOn) stopHum();
    });

    const trackLine = document.getElementById('track-line');
    trackLine.addEventListener('click', (e) => {
      const rect = trackLine.getBoundingClientRect();
      const p = (e.clientX - rect.left) / rect.width;
      film.progress(Math.max(0, Math.min(1, p)));
    });

    document.getElementById('btn-fs').addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    });

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => { btnPlay.click(); }, 400);
    });
  </script>
</body>
</html>
